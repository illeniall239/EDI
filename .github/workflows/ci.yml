name: CI

# Lints and builds. There is no test suite -- see CONTRIBUTING.md -- so this
# checks that the code is syntactically sound and that both halves still
# compile, which is a floor rather than a guarantee.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check backend
      - name: Import check
        # Catches the failure mode a linter misses: a provider or store module
        # that parses fine but blows up on import.
        working-directory: backend
        run: python -c "import llm_providers, stores, settings, limits"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edi-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: edi-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
