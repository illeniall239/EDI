# Lint configuration.
#
# The default rule set, minus two purely stylistic checks. Everything ruff
# flags here is now fixed, so a failure in CI means something new -- which is
# the only way a linter earns its place.

target-version = "py311"
line-length = 120

[lint]
# Stated explicitly rather than inherited. Ruff's implicit default is whatever
# the installed version says it is, and CI installs ruff unpinned -- so leaving
# this out meant a new ruff release could fail the build on code nobody had
# touched. It did: 0.9.8 reported nothing here and 0.16.4 reported 356 things.
# These four groups are pycodestyle errors and pyflakes, which is what this
# project has been kept clean against.
select = ["E4", "E7", "E9", "F"]

# E701/E702 object to `if x: return` and `a = 1; b = 2`. That is a formatting
# opinion rather than a defect, and this codebase uses the compact form in
# enough places that enforcing it would mean a large diff that changes no
# behaviour. Left off deliberately, not overlooked.
ignore = ["E701", "E702"]

[lint.per-file-ignores]
# Re-exports: the whole point of these modules is to make names available
# elsewhere, which looks like an unused import.
"backend/workspace_store.py" = ["F401"]
"backend/stores/__init__.py" = ["F401"]
